# LLM Service Configuration
active_provider: groq # Options: 'groq', 'ollama'

providers:
  groq:
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    timeout_seconds: 15
    temperature: 0.2
  ollama:
    model: llama3:8b
    base_url: http://localhost:11434
    timeout_seconds: 30
    temperature: 0.2
