[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openirm-backend"
version = "0.1.0"
description = "OpenIRM Backend - AI-driven Insider Risk Management System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OpenIRM Contributors" }
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C90", # mccabe complexity
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["data_pipeline", "prism", "airs", "explainability", "llm_service", "api", "policy_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
